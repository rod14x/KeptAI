  /api/v1/pagos/voucher:
    post:
      tags:
      - Integracion n8n
      operationId: n8nReceiveVoucher
      summary: '[n8n WF2] Registrar un comprobante leído por IA como pago RECIBIDO.'
      description: 'IMPLEMENTADO (MIG-04/05, alcance del voucher de WF2). Con `X-Api-Key` INGESTA registra un pago en fase `RECIBIDO` con su comprobante PRIVADO: valida el JSON, decodifica `imagen_base64` de forma estricta (Base64 puro, sin `data:`), valida el archivo por su contenido (JPEG/PNG decodificables con ImageIO, hasta 25 millones de pixeles; PDF analizable en modo estricto con PDFBox, con paginas y sin cifrado), calcula el SHA-256 de los bytes, lo sube al bucket privado `keptai-vouchers` con una ruta generada por el servidor y crea `pago` + `comprobante` en una transaccion con contexto de servicio. La lectura de la IA NO verifica fondos, NO aplica el pago, NO modifica saldos y NO asocia cliente ni orden (`ordenRef` es null). `pushName` es un dato no confiable: no se guarda ni identifica a nadie. Un monto `3.5` se registra exactamente como `3.50` PEN.


        Obligatorios para registrar: `mensajeId` (id ORIGINAL y estable del mensaje de Evolution; null o vacio = 400; no se genera uno nuevo por reintento ni se sustituye por `recibidoEn`), `chatId` y `clienteJid` (JID con formato del contrato), `extraccion.moneda` (solo `PEN`; otra = 422 `CURRENCY_NOT_SUPPORTED`), `monto > 0` y `fecha` (faltan = 422 `VOUCHER_INCOMPLETE`: no se inventan) e `imagen_base64`. `tipo` ausente se registra como medio `OTRO`. `es_voucher=false` (o `error_parseo`) = 200 `IGNORADO_NO_VOUCHER` sin guardar archivo, pago ni clave. Errores del archivo: 400 `IMAGE_REQUIRED` / `IMAGE_INVALID_BASE64` (prefijo, caracteres invalidos, longitud no multiplo de 4 o truncada), 413 (cuerpo mayor que Base64 de `keptai.n8n.voucher.max-file-bytes` mas metadatos, o archivo decodificado mayor), 422 `IMAGE_UNSUPPORTED_TYPE` (no es un JPEG, PNG o PDF completo, aunque la extension o el MIME digan otra cosa). 503 `STORAGE_UNAVAILABLE` (reintentar) y 502 `STORAGE_REJECTED`. Nunca se descargan URLs aportadas por el cliente.


        Idempotencia: `mensajeId` es la clave (operacion `PAGO_VOUCHER`, tambien `pago.idempotency_key` y `comprobante.provider_message_id`). La identidad funcional incluye instancia, chatId, clienteJid, mensajeId, recibidoEn, tipo, banco, monto, moneda, fecha, hora, codigo_operacion y el SHA-256 de los bytes del archivo (no remitente, destinatario ni confianza). Mismo contenido = misma respuesta 201 con `Idempotency-Replayed: true`; otro contenido o archivo con ese `mensajeId` = 409. Un `mensajeId` distinto con la misma referencia de operacion, monto y fecha NO es un reintento: se registra como posible duplicado financiero (`estadoConciliacion=DUPLICADO`, `duplicadoDePagoId`) sin verificarlo ni aplicarlo y para revision de Administracion.


        Si falla la subida o la base, la transaccion se revierte y el objeto subido en ese intento se elimina antes de liberar la clave (nunca uno ya referenciado por un comprobante confirmado). Ruta EXACTA del nodo `Enviar pago al backend` de WF2. Importes en soles decimales (maximo 2 decimales).

        '
      x-keptai-owner: miguel_adapter_andres_engine
      x-keptai-status: proposed
      x-keptai-implementation: implemented
      x-keptai-task: MIG-04-05
      x-keptai-proposed-roles:
      - service_n8n
      x-keptai-idempotency:
        mode: derived
        operation: PAGO_VOUCHER
        key: mensajeId
        hash: sha256 del cuerpo canónico
      x-keptai-source: Middleware/n8n/WF2_voucher_pago.json#Enviar pago al backend
      security:
      - serviceApiKey: []
      requestBody:
        required: true
        content:
