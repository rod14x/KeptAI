  /api/v1/ordenes/ingesta:
    post:
      tags:
      - Integracion n8n
      operationId: n8nIngestOrder
      summary: '[n8n WF1] Recibir la hoja de resumen y el transcript de un chat cerrado con /cerrar.'
      description: 'IMPLEMENTADO (MIG-05, alcance de la ingesta de WF1). Con `X-Api-Key` de un servicio INGESTA activo valida el JSON (un objeto por solicitud, nunca el array de items de n8n) y, en una sola transaccion con contexto de servicio, crea una orden `BORRADOR` y su hoja de resumen `BORRADOR` v1 a partir de los datos ESTRUCTURADOS de `extraccion`, mas el canal (metadatos instancia/JID) y la auditoria. Responde 201. NO guarda `transcript`, `hojaResumenMd` ni el crudo del modelo (D-007): el resumen guardado se construye en el servidor desde la proyeccion estructurada. No crea ni asocia cliente, marca ni vendedor (avisos `CLIENTE_SIN_ASOCIAR`, `MARCA_SIN_ASIGNAR`, `VENDEDOR_SIN_RESOLVER`), no confirma, no aprueba credito y no habilita produccion; `vendedorJid` no autentica a nadie. Los datos que no caben en el modelo no se inventan: una condicion de pago incompleta queda sin registrar (avisos) y los items solo se crean si todos traen cantidad y precio.


        La organizacion y la instancia autenticas salen de PostgreSQL por la clave: `instancia` del JSON debe coincidir (403 si no) y ningun campo del cuerpo concede acceso. Errores: 400 (JSON invalido, array, campos desconocidos, `extraccion` incompleta segun el esquema), 401 (clave ausente, invalida, revocada, repetida o junto a otra credencial), 403 (alcance o instancia incorrectos), 409 `IDEMPOTENCY_CONFLICT`, 413 (cuerpo mayor que `keptai.n8n.ingesta.max-body-bytes`, 524288 bytes por defecto), 415 (no `application/json`), 422 (`AMOUNT_INCONSISTENT`: anticipo mayor que el total; `CURRENCY_NOT_SUPPORTED`), 503 (credencial o base no disponibles).


        Idempotencia: clave `instancia:chatId:generadoEn` (instante UTC) y hash SHA-256 de los datos funcionales estructurados (instancia, chatId, vendedorJid, generadoEn y la extraccion sin `crudo` ni texto de error), guardados en `solicitud_idempotente` (operacion `ORDEN_INGESTA`) junto con la respuesta estructurada, nunca el cuerpo. El mismo contenido repite la respuesta 201 con `Idempotency-Replayed: true`; otro contenido con esa clave = 409; dos solicitudes simultaneas no crean dos pedidos. En un reintento n8n debe conservar `generadoEn`, `chatId`, `instancia`, `vendedorJid` y la extraccion.

        Ruta EXACTA del nodo `Enviar pedido al backend` de WF1. Los importes llegan en SOLES decimales (JSON number, maximo 2 decimales) y se convierten de forma exacta (sin float, sin truncar). `confianza` es informativa y no autoriza nada.

        '
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-implementation: implemented
      x-keptai-task: MIG-05
      x-keptai-proposed-roles:
      - service_n8n
      x-keptai-idempotency:
        mode: derived
        operation: ORDEN_INGESTA
        key: instancia:chatId:generadoEn
        hash: sha256 del cuerpo canónico
      x-keptai-source: Middleware/n8n/WF1_cierre_venta.json#Enviar pedido al backend
      security:
      - serviceApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/N8nIngestaOrdenRequest'
            examples:
              creditOrder:
                $ref: '#/components/examples/N8nIngestaCredit'
              parseFailure:
                $ref: '#/components/examples/N8nIngestaParseFailure'
      responses:
        '201':
          description: 'Borrador creado (o repetido de forma idempotente con `Idempotency-Replayed: true`). No confirma ni libera nada.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/N8nIngestaOrdenResponse'
              examples:
                draft:
                  $ref: '#/components/examples/N8nIngestaResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
