      description: Secreto saliente hacia WF3; distinto de X-Api-Key.
  headers:
    XRequestId:
      description: Identificador de la petición; coincide con `request_id` de los errores.
      schema:
        type: string
        format: uuid
    IdempotencyReplayed:
      description: '`true` si la respuesta es la repetición de una operación ya ejecutada con la misma clave y contenido.'
      schema:
        type: boolean
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Clave generada por el cliente (se recomienda UUID v4), única por intención de operación.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 25
    Cursor:
      name: cursor
      in: query
      required: false
      description: Cursor opaco devuelto en `page.next_cursor`.
      schema:
        type: string
        minLength: 1
        maxLength: 512
    AsOf:
      name: as_of
      in: query
      required: false
      description: Fecha de corte (America/Lima). Por omisión, la fecha actual del servidor.
      schema:
        type: string
        format: date
    EvidenceId:
      name: evidence_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    JobId:
      name: job_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    DraftId:
      name: draft_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OrderId:
      name: order_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    PaymentId:
      name: payment_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    ReceivableId:
      name: receivable_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CustomerId:
      name: customer_id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    OutboundMessageId:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
  responses:
    BadRequest:
      description: Solicitud inválida (formato, rango, campo desconocido). Código `VALIDATION_ERROR` o `BAD_REQUEST`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorExtended'
          examples:
            validation:
              $ref: '#/components/examples/ErrorValidation'
    Unauthorized:
      description: Sin autenticación válida. Código `UNAUTHORIZED` (comportamiento vigente de MIG-01).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unauthorized:
              $ref: '#/components/examples/ErrorUnauthorized'
    Forbidden:
      description: Autenticado sin membresía o rol suficiente. Código `FORBIDDEN`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            forbidden:
              $ref: '#/components/examples/ErrorForbidden'
    NotFound:
      description: No existe o pertenece a otra organización (indistinguible por diseño). Código `NOT_FOUND`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            notFound:
              $ref: '#/components/examples/ErrorNotFound'
    Conflict:
      description: 'Conflicto de estado o idempotencia. Códigos propuestos: `IDEMPOTENCY_KEY_CONFLICT`, `IDEMPOTENCY_IN_PROGRESS`,
        `REVISION_CONFLICT`, `INVALID_STATE`, `ORGANIZATION_SELECTION_REQUIRED` (solo `getMyContext`/panel con varias membresías).

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorExtended'
          examples:
            idempotencyConflict:
              $ref: '#/components/examples/ErrorIdempotencyConflict'
    UnprocessableEntity:
      description: 'Regla de negocio rechazada sin cambiar datos. Códigos propuestos: `DRAFT_INCOMPLETE`, `DUPLICATE_PAYMENT`,
        `ORPHAN_PAYMENT`, `AMOUNT_MISMATCH`,

        `PAYMENT_NOT_VERIFIED`, `CURRENCY_MISMATCH`, `INSUFFICIENT_BALANCE`. Lista y mapeo por acordar con Andrés.

        '
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiErrorExtended'
          examples:
            duplicate:
              $ref: '#/components/examples/ErrorDuplicatePayment'
    PayloadTooLarge:
      description: Supera el tamaño propuesto. Código `PAYLOAD_TOO_LARGE`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            tooLarge:
              $ref: '#/components/examples/ErrorPayloadTooLarge'
    ServiceUnavailable:
      description: La credencial, la base o el almacenamiento no estan disponibles por ahora; se puede reintentar. Codigos `SERVICE_UNAVAILABLE` o `STORAGE_UNAVAILABLE`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unavailable:
              $ref: '#/components/examples/ErrorServiceUnavailable'
    UnsupportedMediaType:
      description: Tipo de archivo no permitido. Código `UNSUPPORTED_MEDIA_TYPE`.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            unsupported:
              $ref: '#/components/examples/ErrorUnsupportedMedia'
  schemas:
    Uuid:
      type: string
      format: uuid
    CurrencyCode:
      type: string
      enum:
      - PEN
      description: Solo PEN en el MVP/demo. No se mezclan monedas.
    DataOrigin:
      type: string
      enum:
      - demo_fixture
      - manual_entry
      - reviewed_extraction
      description: Origen del dato. `demo_fixture` = semilla ficticia identificada; no es dato de Corpotex.
    Money:
      type: object
      additionalProperties: false
      required:
      - amount_cents
      - currency
      properties:
        amount_cents:
          type: integer
          minimum: -9007199254740991
          maximum: 9007199254740991
          description: Centavos enteros; puede ser negativo (margen
          resultado: null
          caja).: null
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    NonNegativeMoney:
      type: object
      additionalProperties: false
      required:
      - amount_cents
      - currency
      properties:
        amount_cents:
          type: integer
          minimum: 0
          maximum: 9007199254740991
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    PositiveMoney:
      type: object
      additionalProperties: false
      required:
      - amount_cents
      - currency
      properties:
        amount_cents:
          type: integer
          minimum: 1
          maximum: 9007199254740991
          description: Importe de pago o venta; nunca cero ni negativo.
        currency:
          $ref: '#/components/schemas/CurrencyCode'
    OptionalMoney:
      oneOf:
      - $ref: '#/components/schemas/Money'
      - type: 'null'
    PageInfo:
      type: object
      additionalProperties: false
      required:
      - limit
      - next_cursor
      properties:
        limit:
          type: integer
          minimum: 1
          maximum: 100
        next_cursor:
          type:
          - string
          - 'null'
          maxLength: 512
          description: '`null` si no hay más páginas.'
    ApiError:
      type: object
      description: Forma vigente del error (MIG-01).
      required:
      - code
      - message
      - request_id
      properties:
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          description: Hoy es el nombre de HttpStatus; los códigos de dominio se proponen.
        message:
          type: string
        request_id:
          type:
          - string
          - 'null'
    ApiErrorDetail:
      type: object
      additionalProperties: false
      required:
      - field
      - code
      - message
      properties:
        field:
          type: string
          description: Ruta del campo en snake_case
          p. ej. `voucher_fields.amount.value.amount_cents`.: null
        code:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
        message:
          type: string
    ApiErrorExtended:
      description: Extensión compatible propuesta; un cliente que solo conoce ApiError ignora los campos nuevos.
      allOf:
      - $ref: '#/components/schemas/ApiError'
      - type: object
        properties:
          details:
            type: array
            items:
              $ref: '#/components/schemas/ApiErrorDetail'
            maxItems: 50
          retryable:
            type: boolean
    UserRole:
      type: string
      enum:
      - VENDEDOR
      - ADMIN
      - GERENTE
      - JEFE_TALLER
      description: 'Roles vigentes de BD (`usuario.rol`, V1): una fila por usuario y organizacion, es decir un solo rol por
        contexto.

        `ADMIN` = Administracion/Cobranza del panel. Los permisos por operacion (`x-keptai-proposed-roles`) son PROPUESTA
        de privilegio minimo;

        el rol y la organizacion salen de la fila `usuario` cuyo `auth_user_id` es el `sub` del JWT, nunca del cuerpo.

        '
    UserContext:
      type: object
      additionalProperties: false
      required:
      - user_id
      - organization_id
      - role
      properties:
        user_id:
          $ref: '#/components/schemas/Uuid'
        organization_id:
          $ref: '#/components/schemas/Uuid'
        role:
          $ref: '#/components/schemas/UserRole'
    EvidenceKind:
      type: string
      enum:
      - text_chat
      - voucher_image
      - audio_note
    EvidenceStatus:
      type: string
      enum:
      - stored
      - discarded
    Evidence:
      type: object
      additionalProperties: false
      required:
      - id
      - kind
      - status
      - content_type
      - size_bytes
      - sha256
      - text_preview
      - label
      - data_origin
      - uploaded_by_user_id
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        kind:
          $ref: '#/components/schemas/EvidenceKind'
        status:
          $ref: '#/components/schemas/EvidenceStatus'
        content_type:
          type:
          - string
          - 'null'
          maxLength: 100
        size_bytes:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 10485760
        sha256:
          type:
          - string
          - 'null'
          pattern: ^[0-9a-f]{64}$
        text_preview:
          type:
          - string
          - 'null'
          maxLength: 200
          description: Primeros caracteres del chat; visible solo a roles de captura/revisión (por acordar).
        label:
          type:
          - string
          - 'null'
          maxLength: 120
        data_origin:
          $ref: '#/components/schemas/DataOrigin'
        uploaded_by_user_id:
          $ref: '#/components/schemas/Uuid'
        created_at:
          type: string
          format: date-time
    EvidencePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Evidence'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    CreateTextEvidenceRequest:
      type: object
      additionalProperties: false
      required:
      - content
      properties:
        content:
          type: string
          minLength: 1
          maxLength: 20000
          description: Texto del chat. Es dato
          no instrucción.: null
        label:
          type:
          - string
          - 'null'
          maxLength: 120
    UploadEvidenceFileRequest:
      type: object
      additionalProperties: false
      required:
      - file
      - kind
      properties:
        file:
          type: string
          contentMediaType: application/octet-stream
          description: Voucher privado JPEG, PNG o PDF, hasta 10 MiB. No audio ni chat (D-007).
        kind:
          type: string
          enum:
          - voucher_image
        label:
          type: string
          maxLength: 120
    EvidenceDownloadLink:
      type: object
      additionalProperties: false
      required:
      - url
      - expires_at
      properties:
        url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    DraftType:
      type: string
      enum:
      - order
      - payment_voucher
    DraftStatus:
      type: string
      enum:
      - pending_review
      - confirmed
      - discarded
    FieldStatus:
      type: string
      enum:
      - present
      - missing
      - illegible
    ModelConfidencePermille:
      type:
      - integer
      - 'null'
      minimum: 0
      maximum: 1000
      description: 'Confianza DECLARADA POR EL MODELO, en milésimas (0.82 -> 820; redondeo half-even desde el decimal 0..1
        de n8n; `numeric(4,3)` en BD).

        Dato informativo rotulado como tal: ni autoriza crédito, fondos o aplicación ni reemplaza la verificación humana.

        '
    JobStatus:
      type: string
      enum:
      - queued
      - running
      - succeeded
      - failed
    StartExtractionRequest:
      type: object
      additionalProperties: false
      required:
      - expected_draft_type
      properties:
        expected_draft_type:
          $ref: '#/components/schemas/DraftType'
    ExtractionJob:
      type: object
      additionalProperties: false
      required:
      - id
      - evidence_id
      - expected_draft_type
      - status
      - attempt
      - error_code
      - error_message
      - retryable
      - draft_id
      - created_at
      - finished_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        evidence_id:
          $ref: '#/components/schemas/Uuid'
        expected_draft_type:
          $ref: '#/components/schemas/DraftType'
        status:
          $ref: '#/components/schemas/JobStatus'
        attempt:
          type: integer
          minimum: 0
          maximum: 10
        error_code:
          type:
          - string
          - 'null'
          pattern: ^[A-Z][A-Z0-9_]*$
        error_message:
          type:
          - string
          - 'null'
          maxLength: 500
        retryable:
          type: boolean
        draft_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        finished_at:
          type:
          - string
          - 'null'
          format: date-time
    ExtractedString:
      type: object
      additionalProperties: false
      required:
      - value
      - status
      - source_fragment
      - human_corrected
      properties:
        value:
          type:
          - string
          - 'null'
          maxLength: 1000
        status:
          $ref: '#/components/schemas/FieldStatus'
        source_fragment:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Fragmento de la evidencia de donde proviene (procedencia).
        human_corrected:
          type: boolean
      if:
        properties:
          status:
            const: present
      then:
        properties:
          value:
            type: string
      else:
        properties:
          value:
            type: 'null'
    ExtractedInteger:
      type: object
      additionalProperties: false
      required:
      - value
      - status
      - source_fragment
      - human_corrected
      properties:
        value:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
        status:
          $ref: '#/components/schemas/FieldStatus'
        source_fragment:
          type:
          - string
          - 'null'
          maxLength: 500
        human_corrected:
          type: boolean
      if:
        properties:
          status:
            const: present
      then:
        properties:
          value:
            type: integer
      else:
        properties:
          value:
            type: 'null'
    ExtractedMoney:
      type: object
      additionalProperties: false
      required:
      - value
      - status
      - source_fragment
      - human_corrected
      properties:
        value:
          oneOf:
          - $ref: '#/components/schemas/PositiveMoney'
          - type: 'null'
        status:
          $ref: '#/components/schemas/FieldStatus'
        source_fragment:
          type:
          - string
          - 'null'
          maxLength: 500
        human_corrected:
          type: boolean
      if:
        properties:
          status:
            const: present
      then:
        properties:
          value:
            $ref: '#/components/schemas/PositiveMoney'
      else:
        properties:
          value:
            type: 'null'
    ExtractedDateTime:
      type: object
      additionalProperties: false
      required:
      - value
      - status
      - source_fragment
      - human_corrected
      properties:
        value:
          type:
          - string
          - 'null'
          format: date-time
        status:
          $ref: '#/components/schemas/FieldStatus'
        source_fragment:
          type:
          - string
          - 'null'
          maxLength: 500
        human_corrected:
          type: boolean
      if:
        properties:
          status:
            const: present
      then:
        properties:
          value:
            type: string
      else:
        properties:
          value:
            type: 'null'
    OrderDraftFields:
      type: object
      additionalProperties: false
      required:
      - customer_name
      - brand
      - product_description
      - quantity
      - sale_amount
      properties:
        customer_name:
          $ref: '#/components/schemas/ExtractedString'
        brand:
          $ref: '#/components/schemas/ExtractedString'
        product_description:
          $ref: '#/components/schemas/ExtractedString'
        quantity:
          $ref: '#/components/schemas/ExtractedInteger'
        sale_amount:
          $ref: '#/components/schemas/ExtractedMoney'
    VoucherDraftFields:
      type: object
      additionalProperties: false
      required:
      - payer_name
      - channel
      - amount
      - operation_reference
      - paid_at
      properties:
        payer_name:
          $ref: '#/components/schemas/ExtractedString'
        channel:
          $ref: '#/components/schemas/ExtractedString'
        amount:
          $ref: '#/components/schemas/ExtractedMoney'
        operation_reference:
          $ref: '#/components/schemas/ExtractedString'
        paid_at:
          $ref: '#/components/schemas/ExtractedDateTime'
    ExtractionDraft:
      type: object
      additionalProperties: false
      description: 'Exactamente uno de `order_fields` / `voucher_fields` según `draft_type`. `model_reported_confidence_permille`
        es el valor que declaró el modelo (n8n, `hoja_resumen.confianza` x 1000): no es una probabilidad calibrada, no aprueba
        nada y no sustituye la revisión humana; `null` si no hubo extracción automática.

        '
      required:
      - id
      - evidence_id
      - draft_type
      - status
      - revision
      - order_fields
      - voucher_fields
      - resulting_order_id
      - resulting_payment_id
      - reviewed_by_user_id
      - model_reported_confidence_permille
      - created_at
      - updated_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        evidence_id:
          $ref: '#/components/schemas/Uuid'
        draft_type:
          $ref: '#/components/schemas/DraftType'
        status:
          $ref: '#/components/schemas/DraftStatus'
        revision:
          type: integer
          minimum: 1
          maximum: 1000000
        order_fields:
          oneOf:
          - $ref: '#/components/schemas/OrderDraftFields'
          - type: 'null'
        voucher_fields:
          oneOf:
          - $ref: '#/components/schemas/VoucherDraftFields'
          - type: 'null'
        resulting_order_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        resulting_payment_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        reviewed_by_user_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        model_reported_confidence_permille:
          $ref: '#/components/schemas/ModelConfidencePermille'
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            draft_type:
              const: order
        then:
          properties:
            order_fields:
              $ref: '#/components/schemas/OrderDraftFields'
            voucher_fields:
              type: 'null'
        else:
          properties:
            voucher_fields:
              $ref: '#/components/schemas/VoucherDraftFields'
            order_fields:
              type: 'null'
    ExtractionDraftPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ExtractionDraft'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    OrderFieldsCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        customer_name:
          type: string
          minLength: 1
          maxLength: 200
        brand:
          type: string
          minLength: 1
          maxLength: 100
        product_description:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: integer
          minimum: 1
          maximum: 1000000
        sale_amount:
          $ref: '#/components/schemas/PositiveMoney'
    VoucherFieldsCorrection:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        payer_name:
          type: string
          minLength: 1
          maxLength: 200
        channel:
          type: string
          minLength: 1
          maxLength: 50
        amount:
          $ref: '#/components/schemas/PositiveMoney'
        operation_reference:
          type: string
          minLength: 1
          maxLength: 100
        paid_at:
          type: string
          format: date-time
    CorrectDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      description: Exactamente uno de `order_fields` / `voucher_fields`, coherente con el tipo del borrador.
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 1000000
        order_fields:
          $ref: '#/components/schemas/OrderFieldsCorrection'
        voucher_fields:
          $ref: '#/components/schemas/VoucherFieldsCorrection'
      oneOf:
      - required:
        - order_fields
      - required:
        - voucher_fields
    ConfirmDraftRequest:
      type: object
      additionalProperties: false
      required:
      - expected_revision
      properties:
        expected_revision:
          type: integer
          minimum: 1
          maximum: 1000000
    ConfirmDraftResponse:
      type: object
      additionalProperties: false
      required:
      - draft
      - order_id
      - payment_id
      - funds_verified
      - balance_changed
      properties:
        draft:
          $ref: '#/components/schemas/ExtractionDraft'
        order_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        payment_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        funds_verified:
          type: boolean
          const: false
          description: Confirmar no verifica fondos.
        balance_changed:
          type: boolean
          const: false
          description: Confirmar no reduce ningún saldo.
    DiscardDraftRequest:
      type: object
      additionalProperties: false
      properties:
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
    ProductionMode:
      type: string
      enum:
      - own
      - outsourced
    OrderStatus:
      type: string
      enum:
      - draft
      - pending_approval
      - held
      - released
      - in_production
      - dispatched
      - closed
      - cancelled
      description: '1:1 con `orden.estado`: BORRADOR, PENDIENTE_APROBACION, RETENIDA, LIBERADA, EN_PRODUCCION, DESPACHADA,
        CERRADA, CANCELADA. El cierre financiero es otro eje (`receivable_status`).'
    OrderSource:
      type: string
      enum:
      - whatsapp
      - manual
      - csv
      description: 1:1 con `orden.origen` (WHATSAPP, MANUAL, CSV). No es `data_origin`.
    PaymentCondition:
      type: string
      enum:
      - cash
      - advance
      - credit
      description: 1:1 con `orden.condicion_pago` (CONTADO, ANTICIPO, CREDITO).
    ReceivableStatus:
      type: string
      enum:
      - pending
      - partially_paid
      - paid
      - overdue
      - voided
      description: 1:1 con `obligacion_cobro.estado` (PENDIENTE, PARCIAL, PAGADA, MORA, ANULADA). Quien fija MORA (motor o
        proceso programado) es decisión de Andrés; la mora de un cliente se lee de `v_cliente_mora` (saldo vencido), sin bloquear.
    TermStartEvent:
      type: string
      enum:
      - dispatch
      description: '`obligacion_cobro.evento_inicio_plazo` = DESPACHO: el plazo corre desde la fecha del acta de despacho
        (fecha de negocio asentada), no desde el pedido ni desde un mensaje del chat.'
    DueBucket:
      type: string
      enum:
      - awaiting_dispatch
      - not_due
      - due_today
      - overdue
      description: 'Derivado por el motor desde `vence_en`. `awaiting_dispatch` mientras no hay acta de despacho (`due_date`
        nulo): el reloj no corre desde el pedido.'
    CustomerRef:
      type: object
      additionalProperties: false
      required:
      - id
      - name
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        name:
          type: string
          minLength: 1
          maxLength: 200
    Order:
      type: object
      additionalProperties: false
      description: 'Tabla de origen `orden` (V1). `display_code` = `orden.ref` (p. ej. `ORD-123`; la semilla ficticia usa
        `P-001`). `status` es el estado de la orden;

        `receivable_status` el de su única obligación (`null` mientras no exista). `due_date` = `dispatch_date` + `credit_term_days`,
        calculado por el servidor y `null` hasta el acta de despacho.

        `sale` es positivo en el contrato (BD admite `total >= 0`). El plazo de crédito vigente es 15 a 30 días (D-005, dirección
        del equipo; A02-Q32 habló de 30/45).

        '
      required:
      - id
      - display_code
      - customer
      - brand
      - product_line
      - production_mode
      - sale
      - status
      - source
      - payment_condition
      - credit_term_days
      - advance_required
      - requested_delivery_date
      - production_start_date
      - dispatch_date
      - receivable_status
      - due_date
      - source_evidence_id
      - data_origin
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_code:
          type: string
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
          description: Etiqueta legible (`orden.ref`); no es identificador.
        customer:
          oneOf:
          - &id001
            $ref: '#/components/schemas/CustomerRef'
          - type: 'null'
        brand:
          type:
          - string
          - 'null'
          maxLength: 100
          description: '`marca.nombre`; `orden.marca_id` admite nulo.'
        product_line:
          type:
          - string
          - 'null'
          maxLength: 100
        production_mode:
          $ref: '#/components/schemas/ProductionMode'
        sale:
          oneOf:
          - &id002
            $ref: '#/components/schemas/PositiveMoney'
          - type: 'null'
        status:
          $ref: '#/components/schemas/OrderStatus'
        source:
          $ref: '#/components/schemas/OrderSource'
        payment_condition:
          oneOf:
          - &id003
            $ref: '#/components/schemas/PaymentCondition'
          - type: 'null'
        credit_term_days:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 365
          description: '`orden.plazo_dias`; obligatorio si la condición es crédito.'
        advance_required:
          $ref: '#/components/schemas/NonNegativeMoney'
        requested_delivery_date:
          type:
          - string
          - 'null'
          format: date
        production_start_date:
          type:
          - string
          - 'null'
          format: date
          description: La fija el servidor cuando la orden pasa el control (gatekeeper).
        dispatch_date:
          type:
          - string
          - 'null'
          format: date
          description: Fecha del acta de despacho (`despacho.fecha_despacho`).
        receivable_status:
          oneOf:
          - $ref: '#/components/schemas/ReceivableStatus'
          - type: 'null'
        due_date:
          type:
          - string
          - 'null'
          format: date
        source_evidence_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        data_origin:
          $ref: '#/components/schemas/DataOrigin'
        created_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            payment_condition:
              const: credit
        then:
          properties:
            credit_term_days:
              type: integer
      - if:
          properties:
            dispatch_date:
              type: 'null'
        then:
          properties:
            due_date:
              type: 'null'
      - if:
          properties:
            status:
              not:
                const: draft
        then:
          properties:
            customer: *id001
            sale: *id002
            payment_condition: *id003
    OrderPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Order'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    DispatchRequest:
      type: object
      additionalProperties: false
      required:
      - dispatch_date
      description: La fecha del acta es una fecha de negocio America/Lima asentada por quien despacha; no se infiere de la
        hora de un mensaje.
      properties:
        dispatch_date:
          type: string
          format: date
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    PaymentPhase:
      type: string
      enum:
      - received
      - bank_verified
      - applied
      description: '1:1 con `pago.fase` (RECIBIDO, VERIFICADO_BANCO, APLICADO). `received` = comprobante registrado: ni fondos
        verificados ni saldo reducido. Un voucher leído por IA nace siempre en `received`.'
    ReconciliationStatus:
      type: string
      enum:
      - pending
      - applied
      - partial
      - duplicate
      - orphan
      - amount_mismatch
      description: '1:1 con `pago.estado_conciliacion` (PENDIENTE, APLICADO, PARCIAL, DUPLICADO, SIN_ORDEN, NO_CUADRA); eje
        independiente de `phase`.

        Lectura propuesta (pendiente de confirmar con Andrés): `applied` = cubre la obligación completa; `partial` = cubre
        solo una parte.

        '
    PaymentChannel:
      type: string
      enum:
      - yape
      - plin
      - bank_transfer
      - deposit
      - cash
      - other
      description: 1:1 con `pago.medio` (YAPE, PLIN, TRANSFERENCIA, DEPOSITO, EFECTIVO, OTRO).
    VerificationMethod:
      type: string
      enum:
      - simulated_demo
      - manual_confirmation
    PaymentVerification:
      type: object
      additionalProperties: false
      required:
      - method
      - is_simulated
      - verified_by_user_id
      - verified_at
      - note
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
        is_simulated:
          type: boolean
        verified_by_user_id:
          $ref: '#/components/schemas/Uuid'
        verified_at:
          type: string
          format: date-time
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    Payment:
      type: object
      additionalProperties: false
      description: 'Tabla de origen `pago` (+ `comprobante`). Recibido, verificado en banco y aplicado son fases e importes
        distintos; la conciliación es otro eje.

        `display_code` es nulo hoy: V1 no tiene columna de etiqueta legible para pagos (las etiquetas V-001 de los ejemplos
        son de la semilla ficticia). Un pago duplicado nunca se verifica ni se aplica.

        '
      required:
      - id
      - display_code
      - phase
      - reconciliation_status
      - channel
      - operation_reference
      - payer_name
      - paid_at
      - received_amount
      - verified_amount
      - applied_amount
      - unapplied_amount
      - duplicate_of_payment_id
      - evidence_ids
      - verification
      - model_reported_confidence_permille
      - data_origin
      - created_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        display_code:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
          description: Etiqueta legible; no es identificador. Sin columna en V1 (pendiente de Andrés).
        phase:
          $ref: '#/components/schemas/PaymentPhase'
        reconciliation_status:
          $ref: '#/components/schemas/ReconciliationStatus'
        channel:
          $ref: '#/components/schemas/PaymentChannel'
        operation_reference:
          type:
          - string
          - 'null'
          maxLength: 100
          description: '`pago.codigo_operacion`; la unicidad se busca por organización, nunca de forma global.'
        payer_name:
          type:
          - string
          - 'null'
          maxLength: 200
        paid_at:
          type:
          - string
          - 'null'
          format: date-time
          description: BD guarda `pago.fecha_pago` (date, America/Lima); la hora del instante es informativa y puede ser nula.
        received_amount:
          $ref: '#/components/schemas/PositiveMoney'
        verified_amount:
          oneOf:
          - $ref: '#/components/schemas/NonNegativeMoney'
          - type: 'null'
          description: '`null` hasta registrar verificación.'
        applied_amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        unapplied_amount:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Verificado menos aplicado. Es 0 mientras el pago esté solo recibido o sea duplicado.
        duplicate_of_payment_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        evidence_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          maxItems: 20
        verification:
          oneOf:
          - $ref: '#/components/schemas/PaymentVerification'
          - type: 'null'
        model_reported_confidence_permille:
          $ref: '#/components/schemas/ModelConfidencePermille'
          type:
          - integer
          - 'null'
        data_origin:
          $ref: '#/components/schemas/DataOrigin'
        created_at:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            phase:
              const: received
        then:
          properties:
            verified_amount:
              type: 'null'
            verification:
              type: 'null'
            applied_amount:
              properties:
                amount_cents:
                  const: 0
      - if:
          properties:
            phase:
              const: bank_verified
        then:
          properties:
            verification:
              $ref: '#/components/schemas/PaymentVerification'
            verified_amount:
              $ref: '#/components/schemas/NonNegativeMoney'
      - if:
          properties:
            phase:
              const: applied
        then:
          properties:
            verification:
              $ref: '#/components/schemas/PaymentVerification'
            verified_amount:
              $ref: '#/components/schemas/NonNegativeMoney'
            applied_amount:
              properties:
                amount_cents:
                  minimum: 1
      - if:
          properties:
            reconciliation_status:
              const: duplicate
        then:
          properties:
            phase:
              const: received
            duplicate_of_payment_id:
              $ref: '#/components/schemas/Uuid'
            verified_amount:
              type: 'null'
            verification:
              type: 'null'
            applied_amount:
              properties:
                amount_cents:
                  const: 0
        else:
          properties:
            duplicate_of_payment_id:
              type: 'null'
      - if:
          properties:
            reconciliation_status:
              enum:
              - applied
              - partial
        then:
          properties:
            phase:
              const: applied
      - if:
          properties:
            reconciliation_status:
              enum:
              - pending
              - orphan
        then:
          properties:
            applied_amount:
              properties:
                amount_cents:
                  const: 0
    PaymentPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Payment'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    ReconciliationClass:
      type: string
      enum:
      - matches
      - partial
      - duplicate
      - orphan
      - amount_mismatch
    MatchReason:
      type: string
      enum:
      - amount_equal
      - amount_below_balance
      - amount_above_balance
      - reference_already_used
      - customer_name_similar
    ReconciliationCandidate:
      type: object
      additionalProperties: false
      required:
      - receivable_id
      - order_id
      - order_code
      - customer_name
      - balance
      - match_score
      - reasons
      properties:
        receivable_id:
          $ref: '#/components/schemas/Uuid'
        order_id:
          $ref: '#/components/schemas/Uuid'
        order_code:
          type: string
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
        customer_name:
          type: string
          maxLength: 200
        balance:
          $ref: '#/components/schemas/NonNegativeMoney'
        match_score:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 100
          description: Definido por el motor de Andrés; pendiente.
        reasons:
          type: array
          items:
            $ref: '#/components/schemas/MatchReason'
          maxItems: 10
    ReconciliationResult:
      type: object
      additionalProperties: false
      required:
      - payment_id
      - classification
      - candidates
      properties:
        payment_id:
          $ref: '#/components/schemas/Uuid'
        classification:
          $ref: '#/components/schemas/ReconciliationClass'
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/ReconciliationCandidate'
          maxItems: 20
    RegisterVerificationRequest:
      type: object
      additionalProperties: false
      required:
      - method
      properties:
        method:
          $ref: '#/components/schemas/VerificationMethod'
        note:
          type:
          - string
          - 'null'
          maxLength: 500
    ApplyPaymentRequest:
      type: object
      additionalProperties: false
      required:
      - receivable_id
      - amount
      properties:
        receivable_id:
          $ref: '#/components/schemas/Uuid'
        amount:
          $ref: '#/components/schemas/PositiveMoney'
    PaymentApplication:
      type: object
      additionalProperties: false
      required:
      - id
      - payment_id
      - receivable_id
      - applied_amount
      - applied_at
      - applied_by_user_id
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        payment_id:
          $ref: '#/components/schemas/Uuid'
        receivable_id:
          $ref: '#/components/schemas/Uuid'
        applied_amount:
          $ref: '#/components/schemas/PositiveMoney'
        applied_at:
          type: string
          format: date-time
        applied_by_user_id:
          $ref: '#/components/schemas/Uuid'
    Receivable:
      type: object
      additionalProperties: false
      description: 'Tabla de origen `obligacion_cobro` + vista `v_saldo_obligacion`: una sola obligación por orden, sin cuotas
        (D-005); los pagos parciales se reparten en `aplicacion_pago`.

        `balance` lo calcula el motor a partir de aplicaciones válidas; nunca desde OCR ni promesas de pago. `due_date` es
        nulo hasta el acta de despacho.

        '
      required:
      - id
      - order_id
      - order_code
      - customer
      - original_amount
      - applied_amount
      - balance
      - credit_term_days
      - term_start_event
      - due_date
      - due_bucket
      - days_overdue
      - status
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        order_id:
          $ref: '#/components/schemas/Uuid'
        order_code:
          type: string
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
        customer:
          $ref: '#/components/schemas/CustomerRef'
        original_amount:
          $ref: '#/components/schemas/PositiveMoney'
        applied_amount:
          $ref: '#/components/schemas/NonNegativeMoney'
        balance:
          $ref: '#/components/schemas/NonNegativeMoney'
          description: Calculado por el motor a partir de aplicaciones válidas; nunca desde OCR ni promesa de pago.
        credit_term_days:
          type: integer
          minimum: 0
          maximum: 365
          description: '`obligacion_cobro.plazo_dias`.'
        term_start_event:
          $ref: '#/components/schemas/TermStartEvent'
        due_date:
          type:
          - string
          - 'null'
          format: date
          description: '`vence_en` = fecha del acta de despacho + `credit_term_days`; nulo antes del despacho.'
        due_bucket:
          $ref: '#/components/schemas/DueBucket'
        days_overdue:
          type: integer
          minimum: 0
          maximum: 36500
        status:
          $ref: '#/components/schemas/ReceivableStatus'
      allOf:
      - if:
          properties:
            due_bucket:
              const: awaiting_dispatch
        then:
          properties:
            due_date:
              type: 'null'
            days_overdue:
              const: 0
        else:
          properties:
            due_date:
              type: string
      - if:
          properties:
            due_bucket:
              const: overdue
        then:
          properties:
            days_overdue:
              minimum: 1
        else:
          properties:
            days_overdue:
              const: 0
    ReceivablePage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Receivable'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    PaymentApplicationResult:
      type: object
      additionalProperties: false
      required:
      - application
      - payment
      - receivable
      - resolved_alert_ids
      properties:
        application:
          $ref: '#/components/schemas/PaymentApplication'
        payment:
          $ref: '#/components/schemas/Payment'
        receivable:
          $ref: '#/components/schemas/Receivable'
        resolved_alert_ids:
          type: array
          items:
            $ref: '#/components/schemas/Uuid'
          maxItems: 20
    AlertStatus:
      type: string
      enum:
      - open
      - resolved
      - cancelled
      description: 1:1 con `alerta_cobranza.estado` (ABIERTA, RESUELTA, CANCELADA).
    AlertRule:
      type: string
      enum:
      - early_arrears
      - payment_in_review
      - advance_pending
      description: 1:1 con `alerta_cobranza.regla` (MORA_TEMPRANA, PAGO_EN_REVISION, ANTICIPO_PENDIENTE).
    AlertResolution:
      type: string
      enum:
      - payment_applied
      - manual
    CollectionAlert:
      type: object
      additionalProperties: false
      description: 'Tabla de origen `alerta_cobranza`: apunta a una obligación, a un pago en revisión o a ambos. Los desfases
        -3/0/+3 de la cobranza al cliente son de la cola de mensajes

        salientes (`envio_notificacion`, WF3), no de la alerta. La resolución es texto libre en BD; sus dos valores son propuesta.

        '
      required:
      - id
      - receivable_id
      - payment_id
      - rule
      - status
      - responsible_user_id
      - resolution
      - created_at
      - closed_at
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        receivable_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        payment_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        rule:
          $ref: '#/components/schemas/AlertRule'
        status:
          $ref: '#/components/schemas/AlertStatus'
        responsible_user_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        resolution:
          oneOf:
          - $ref: '#/components/schemas/AlertResolution'
          - type: 'null'
        created_at:
          type: string
          format: date-time
        closed_at:
          type:
          - string
          - 'null'
          format: date-time
          description: '`cerrada_en`: obligatoria si la alerta no está abierta.'
      anyOf:
      - properties:
          receivable_id:
            $ref: '#/components/schemas/Uuid'
      - properties:
          payment_id:
            $ref: '#/components/schemas/Uuid'
      allOf:
      - if:
          properties:
            status:
              const: open
        then:
          properties:
            closed_at:
              type: 'null'
            resolution:
              type: 'null'
        else:
          properties:
            closed_at:
              type: string
    CollectionAlertPage:
      type: object
      additionalProperties: false
      required:
      - items
      - page
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CollectionAlert'
          maxItems: 100
        page:
          $ref: '#/components/schemas/PageInfo'
    CreditAuthorizationStatus:
      type: string
      enum:
      - not_required
      - pending
      - approved
      - rejected
    CreditDecisionValue:
      type: string
      enum:
      - approved
      - rejected
      description: Lo que el vendedor puede enviar; `pending` (PENDIENTE) solo lo fija el servidor.
    CreditDecisionRequest:
      type: object
      additionalProperties: false
      required:
      - decision
      - arrears_notice_acknowledged
      description: 'El actor es el usuario del JWT (nunca el cuerpo ni el modelo). Si el cliente tiene saldo vencido, `arrears_notice_acknowledged`
        debe ser `true` (aviso obligatorio, sin bloqueo);

        de lo contrario `422 ARREARS_NOTICE_NOT_ACKNOWLEDGED`. Aprobar exige `credit_term_days` (15 a 30, dirección D-005)
        y la orden a crédito.

        '
      properties:
        decision:
          $ref: '#/components/schemas/CreditDecisionValue'
        arrears_notice_acknowledged:
          type: boolean
        credit_term_days:
          type: integer
          minimum: 15
          maximum: 30
        advance_pct_bps:
          type: integer
          minimum: 0
          maximum: 10000
        reason:
          type: string
          maxLength: 500
      if:
        properties:
          decision:
            const: approved
      then:
        required:
        - credit_term_days
    CreditAuthorization:
      type: object
      additionalProperties: false
      description: 'Tabla de origen `aprobacion_credito` (una decisión por orden; el historial va a `evento_auditoria`). La
        toma el vendedor tras el aviso de mora (D-005); la mora no bloquea.

        Lectura aquí; la acción es `POST /api/v1/orders/{order_id}/credit-decision`. `overdue_balance_reference` = `saldo_referencia`
        (saldo vencido del cliente al decidir).

        '
      required:
      - status
      - responsible_user_id
      - arrears_notice_shown
      - overdue_balance_reference
      - credit_term_days
      - advance_pct_bps
      - reason
      - decided_at
      properties:
        status:
          $ref: '#/components/schemas/CreditAuthorizationStatus'
        responsible_user_id:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        arrears_notice_shown:
          type: boolean
