openapi: 3.1.0
info:
  title: KeptAI API (PROPUESTA de contrato MIG-02)
  version: 0.1.0-proposal
  summary: Contrato propuesto del backend KeptAI. Ningún endpoint está implementado ni operativo.
  description: "**Estado: PROPUESTA para revisión de Andrés (gate de aceptación pendiente).** Este archivo no acredita\nendpoints,\
    \ controladores, persistencia ni motor financiero. Todo ejemplo es **ficticio** (semilla de demostración\nP-001/P-002/V-001..V-003\
    \ de PROP-DB-001 y del prompt adaptado PROP-FRONT-001); no son datos de Corpotex.\n\nConvenciones propuestas (detalle\
    \ y acuerdos pendientes en `Backend/docs/contrato-api.md`):\n\n- **Identificadores:** UUID en `id` y `*_id`. Las etiquetas\
    \ legibles (`P-001`, `V-001`) viajan aparte, en `display_code`,\n  y nunca sustituyen al UUID.\n- **Dinero:** objeto `{amount_cents,\
    \ currency}`. `amount_cents` es un entero (centavos), dentro del rango seguro de\n  JavaScript (±9007199254740991). `currency`\
    \ es `PEN` (demo); un mismo cálculo no mezcla monedas. Los negativos son válidos en margen,\n  resultado y saldo de caja;\
    \ el importe de un pago recibido o aplicado es siempre positivo. Conversión BigDecimal ↔ centavos en un solo punto del\
    \ servidor.\n- **Ausente ≠ cero:** un dato no cargado, ilegible o incompleto es `null` con un estado explícito (`status`,\
    \ `cost_status`,\n  `forecast_status`). Nunca se rellena con 0 ni se inventa.\n- **Fechas:** `date` (`YYYY-MM-DD`, fecha\
    \ de negocio local America/Lima) para vencimientos; instantes `date-time` ISO 8601 con\n  desfase (p. ej. `2026-10-10T09:30:00-05:00`).\
    \ El cliente debe aceptar cualquier desfase.\n- **Autorización:** JWT de Supabase como Bearer (validación real: MIG-03,\
    \ pendiente). La organización se resuelve en el\n  servidor por membresía; ningún cuerpo, ruta ni consulta lleva `organization_id`\
    \ y los cuerpos de petición rechazan campos desconocidos.\n- **Idempotencia:** las operaciones POST del panel exigen `Idempotency-Key`.\
    \ Huella propuesta: organización + usuario + método + ruta con sus parámetros + clave + hash del cuerpo (la misma clave\
    \ sobre otro recurso es otra operación). Autenticación y rol se comprueban antes de consultar la clave. Solo se almacenan\
    \ resultados exitosos: repetir tras un 4xx/5xx reintenta.\n  Misma clave y mismo contenido devuelven el resultado original\
    \ (mismo estado HTTP, cabecera `Idempotency-Replayed: true`).\n  Misma clave con contenido distinto: 409 `IDEMPOTENCY_KEY_CONFLICT`.\
    \ Misma clave en curso: 409 `IDEMPOTENCY_IN_PROGRESS`. Ventana de retención: por acordar.\n- **Errores:** `{code, message,\
    \ request_id}` (ApiError vigente) con `details` y `retryable` opcionales (extensión compatible propuesta).\n- **Listas:**\
    \ paginación por cursor opaco (`limit` 1..100, 25 por omisión).\n- **Separación de conceptos:** voucher recibido ≠ extracción\
    \ ≠ fondos verificados ≠ pago aplicado. Confirmar un borrador no verifica\n  fondos ni aplica el pago. El backend no recalcula\
    \ saldos: invoca el motor de Andrés.\n- Extensiones `x-keptai-*`: `owner`, `status` (siempre `proposed`), `proposed-roles`\
    \ (roles propuestos, sin aprobación) y `task`.\n\nActualización MIG-02: panel en centavos con JWT; n8n en soles decimales\
    \ con X-Api-Key. IA de n8n, reglas de Spring. Autenticación, RLS y endpoints pendientes de implementación. Ver alineacion-bd-n8n.md."
  x-keptai-status: proposed
  x-keptai-demo-data: true
tags:
- name: Contexto
  description: Contexto del usuario (MIG-03).
- name: Evidencias
  description: Texto, voucher y audio (MIG-04).
- name: Extraccion
  description: Trabajos de extracción y borradores (MIG-05/06).
- name: Pedidos
  description: Pedidos persistentes (MIG-06).
- name: Pagos
  description: Conciliación, verificación y aplicación (MIG-07, motor de Andrés).
- name: Cobranza
  description: Obligaciones, alertas y estado de cuenta (MIG-07).
- name: Resultados
  description: Margen, centro productivo, caja a 4 semanas y CSV (MIG-07).
- name: Auditoria
  description: Eventos de auditoría (MIG-07).
- name: Credito
  description: Decisión de crédito del vendedor y despacho que inicia el plazo (MIG-06/07).
- name: Integracion n8n
  description: Rutas EXACTAS que consume n8n (WF0-WF3) con X-Api-Key; contrato de servicio, distinto del panel.
paths:
  /api/v1/me:
    get:
      tags:
      - Contexto
      operationId: getMyContext
      summary: Usuario autenticado, organización resuelta y rol (solo lectura).
      description: 'Implementado en MIG-03-B y probado con JWKS de prueba y PostgreSQL real (fixtures); la integración con Supabase Auth real sigue
        pendiente. Valida firma (RS256/ES256), issuer, audiencia, exp y nbf; el `sub` se resuelve con `keptai_private.resolver_usuario`.
        Con una sola membresía activa responde 200. Sin membresía activa: 403 `FORBIDDEN`. Con varias: 409
        `ORGANIZATION_SELECTION_REQUIRED` (propuesta; la selección de organización aún no está definida y no se elige ninguna).
        Fallo de base o JWKS: 503 `SERVICE_UNAVAILABLE`.

        '
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-implemented: MIG-03-B (fixture JWKS; Auth real pendiente)
      x-keptai-task: MIG-03
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      - GERENTE
      - JEFE_TALLER
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Contexto resuelto por membresía en el servidor.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserContext'
              examples:
                demo:
                  $ref: '#/components/examples/UserContextDemo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/evidences/text:
    post:
      tags:
      - Evidencias
      operationId: createTextEvidence
      summary: Registrar texto pegado o cargado (chat) como evidencia.
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-04
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTextEvidenceRequest'
            examples:
              chat:
                $ref: '#/components/examples/CreateTextEvidenceChat'
      responses:
        '201':
          description: Evidencia de texto registrada (no es todavía un pedido ni un pago).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
              examples:
                chat:
                  $ref: '#/components/examples/EvidenceChat'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
      deprecated: true
      description: 'Fuera del alcance D-007: no persistir chats, audio ni mensajes. IA transitoria en n8n; solo vouchers persistentes. '
  /api/v1/evidences/files:
    post:
      tags:
      - Evidencias
      operationId: uploadEvidenceFile
      summary: Subir imagen de voucher o nota de voz a almacenamiento privado.
      description: 'D-007: solo voucher_image; audio_note/text_chat no habilitados, 422. Límites propuestos (no oficiales,
        por confirmar): imagen JPEG/PNG/WebP hasta 5 MB; audio OGG/MP3/MP4/WAV hasta 10 MB.

        El hash SHA-256 lo calcula el servidor. Nunca se aceptan URLs para que el servidor las descargue.

        '
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-04
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/UploadEvidenceFileRequest'
      responses:
        '201':
          description: Archivo almacenado de forma privada y evidencia registrada.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
              examples:
                voucher:
                  $ref: '#/components/examples/EvidenceVoucher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /api/v1/evidences:
    get:
      tags:
      - Evidencias
      operationId: listEvidences
      summary: Listar evidencias de la organización del usuario.
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-04
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: kind
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/EvidenceKind'
      responses:
        '200':
          description: Página de evidencias.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidencePage'
              examples:
                demo:
                  $ref: '#/components/examples/EvidencePageDemo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/evidences/{evidence_id}:
    get:
      tags:
      - Evidencias
      operationId: getEvidence
      summary: Consultar una evidencia (metadatos).
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-04
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Evidencia.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Evidence'
              examples:
                voucher:
                  $ref: '#/components/examples/EvidenceVoucher'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/evidences/{evidence_id}/download-link:
    get:
      tags:
      - Evidencias
      operationId: getEvidenceDownloadLink
      summary: Obtener un enlace temporal autorizado para ver el archivo privado.
      description: 'Una evidencia de otra organización responde 404, sin revelar su existencia. Las evidencias de texto no
        tienen enlace (409 `INVALID_STATE`). Propuesta: respuesta con `Cache-Control: no-store`, vigencia corta por acordar
        y evento de auditoría de cada emisión.'
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-04
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      responses:
        '200':
          description: Enlace de corta duración.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceDownloadLink'
              examples:
                demo:
                  $ref: '#/components/examples/EvidenceDownloadLinkDemo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/evidences/{evidence_id}/extractions:
    post:
      tags:
      - Extraccion
      operationId: startExtraction
      deprecated: true
      x-keptai-phase: later
      summary: '[DEPRECADA - fase posterior] Iniciar la extracción asíncrona desde una evidencia subida al panel.'
      description: 'Fuera del alcance D-007: no persistir chats, audio ni mensajes. IA transitoria en n8n; solo vouchers persistentes.
        Antecedente fuera del MVP vigente: la IA se ejecuta en n8n (D-005). No implementar otro cliente IA en Spring. **No
        forma parte del MVP vigente.** La IA vive en n8n (D-005: WF1/WF2 llaman al modelo y Spring valida el JSON); mantener
        una segunda canalización de extracción en Spring

        (Gemini directo, propuesta anterior) duplicaría el pipeline. Se conserva solo como referencia para una fase posterior
        (carga manual del panel); no se implementa en MIG-03..07.

        El contenido de la evidencia es dato, nunca instrucción. La extracción no verifica fondos ni decide crédito o saldo.

        Una falla (timeout, JSON inválido, proveedor no disponible) deja el trabajo en `failed` con `retryable`; la edición
        manual del borrador sigue disponible.

        '
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-05
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/EvidenceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartExtractionRequest'
            examples:
              voucher:
                $ref: '#/components/examples/StartExtractionVoucher'
      responses:
        '202':
          description: Trabajo aceptado; consultar su estado.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
              examples:
                queued:
                  $ref: '#/components/examples/ExtractionJobQueued'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/extraction-jobs/{job_id}:
    get:
      tags:
      - Extraccion
      operationId: getExtractionJob
      deprecated: true
      x-keptai-phase: later
      summary: '[DEPRECADA - fase posterior] Consultar el estado de un trabajo de extracción.'
      description: 'Fuera del alcance D-007: no persistir chats, audio ni mensajes. IA transitoria en n8n; solo vouchers persistentes.
        Antecedente fuera del MVP vigente: la IA se ejecuta en n8n (D-005). No implementar otro cliente IA en Spring. Ligada
        a la extracción directa en Spring, retirada del MVP (ver `startExtraction`).'
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-05
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          description: Estado del trabajo.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionJob'
              examples:
                succeeded:
                  $ref: '#/components/examples/ExtractionJobSucceeded'
                failed:
                  $ref: '#/components/examples/ExtractionJobFailed'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/drafts:
    get:
      tags:
      - Extraccion
      operationId: listDrafts
      summary: Listar borradores de extracción.
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-06
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      - name: status
        in: query
        required: false
        schema:
          $ref: '#/components/schemas/DraftStatus'
      responses:
        '200':
          description: Página de borradores.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionDraftPage'
              examples:
                demo:
                  $ref: '#/components/examples/ExtractionDraftPageDemo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/drafts/{draft_id}:
    get:
      tags:
      - Extraccion
      operationId: getDraft
      summary: Consultar un borrador con sus campos presentes, ausentes o ilegibles.
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-06
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DraftId'
      responses:
        '200':
          description: Borrador.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionDraft'
              examples:
                voucher:
                  $ref: '#/components/examples/ExtractionDraftVoucher'
                order:
                  $ref: '#/components/examples/ExtractionDraftOrder'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Extraccion
      operationId: correctDraft
      summary: Corregir campos del borrador (auditado; concurrencia optimista por revisión).
      description: Cada campo corregido pasa a `present` con `human_corrected=true` y genera un evento de auditoría (quién,
        campo, valor anterior y nuevo, fecha).
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-06
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DraftId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CorrectDraftRequest'
            examples:
              voucher:
                $ref: '#/components/examples/CorrectDraftVoucher'
      responses:
        '200':
          description: Borrador actualizado con nueva revisión.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractionDraft'
              examples:
                voucher:
                  $ref: '#/components/examples/ExtractionDraftVoucher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/drafts/{draft_id}/confirmation:
    post:
      tags:
      - Extraccion
      operationId: confirmDraft
      summary: Confirmar el borrador tras revisión humana.
      description: 'Un borrador de pedido crea un pedido persistente (servicio de Andrés). Un borrador de voucher registra
        un pago en estado `received`.

        **Confirmar no verifica fondos ni aplica el pago ni reduce el saldo.** Campos ausentes o ilegibles: 422 `DRAFT_INCOMPLETE`.

        Si el motor detecta una referencia de operación ya usada, el pago nace `duplicate` (quién y cuándo lo marca: acuerdo
        pendiente con Andrés).

        Texto libre del borrador que no cabe en el pedido o en el pago (longitud, canal desconocido): 422 `DRAFT_INCOMPLETE`
        con `details`.

        `expected_revision` desactualizado: 409 `REVISION_CONFLICT`.

        '
      x-keptai-owner: miguel_adapter_andres_engine
      x-keptai-status: proposed
      x-keptai-task: MIG-06
      x-keptai-proposed-roles:
      - VENDEDOR
      - ADMIN
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/DraftId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmDraftRequest'
            examples:
              default:
                $ref: '#/components/examples/ConfirmDraftRequestDemo'
      responses:
        '200':
          description: Borrador confirmado (también en repetición idempotente).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Idempotency-Replayed:
              $ref: '#/components/headers/IdempotencyReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmDraftResponse'
              examples:
                voucher:
                  $ref: '#/components/examples/ConfirmDraftResponseVoucher'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
  /api/v1/drafts/{draft_id}/discard:
    post:
      tags:
      - Extraccion
      operationId: discardDraft
      summary: Descartar un borrador (conserva la evidencia y la auditoría).
      x-keptai-owner: miguel
      x-keptai-status: proposed
      x-keptai-task: MIG-06
      x-keptai-proposed-roles:
      - VENDEDOR
