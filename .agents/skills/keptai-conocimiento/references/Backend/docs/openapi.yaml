webhooks:
  enviarMensajeWF3:
    post:
      tags:
      - Integracion n8n
      operationId: n8nOutboundSendMessage
      summary: '[SALIENTE Spring -> n8n WF3] Pedir el envío de un mensaje de WhatsApp. NO es una ruta de este backend.'
      description: 'Contrato SALIENTE: Spring (planificador `@Scheduled`) llama al webhook `POST {n8nUrl}/webhook/enviar-mensaje`
        de `WF3_enviar_mensaje.json`; este backend NO expone esa ruta.

        Autenticación propia, distinta del panel y de `X-Api-Key`: cabecera `X-Api-Secret` con el secreto compartido (`sharedSecret`),
        que WF3 compara en el nodo `¿Autorizado?`; sin ella o con otro valor WF3 responde 401 `{"error":"no autorizado"}`.

        WF3 responde 202 `{aceptado, mensajeId}` ANTES de enviar y luego informa el resultado por callback (`n8nReportMessageStatus`).
        `numero` solo dígitos (WF3 antepone 51 a un celular de 9 dígitos),

        `delayMs` opcional (si falta, WF3 elige 2.5 a 8.5 s). Solo se envían mensajes ya registrados en `envio_notificacion`
        (idempotencia `idempotencyKey` única por organización). `clienteId` lo ignora WF3 hoy.

        Los tipos son los 7 de `envio_notificacion.tipo`; la cadencia (-3, 0, +3 días) y la ventana horaria las decide Spring.

        '
      x-keptai-owner: miguel_adapter_andres_engine
      x-keptai-status: proposed
      x-keptai-task: MIG-07
      x-keptai-proposed-roles:
      - service_n8n
      x-keptai-direction: outbound
      x-keptai-source: Middleware/n8n/WF3_enviar_mensaje.json#Webhook enviar-mensaje
      security:
      - n8nWebhookSecret: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/N8nMensajeSalienteWebhook'
            examples:
              preventive:
                $ref: '#/components/examples/N8nMensajeSalienteDemo'
      responses:
        '202':
          description: WF3 aceptó el envío; el resultado llega por callback.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/N8nWebhookAccepted'
              examples:
                accepted:
                  $ref: '#/components/examples/N8nWebhookAcceptedDemo'
        '401':
          description: Secreto ausente o incorrecto (respuesta de WF3).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/N8nWebhookUnauthorized'
              examples:
                unauthorized:
                  $ref: '#/components/examples/N8nWebhookUnauthorizedDemo'
security:
- bearerAuth: []
