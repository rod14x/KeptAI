    N8nSoles:
      type: number
      minimum: 0
      maximum: 90071992547409.9
      description: 'Importe en SOLES decimales tal como lo emite n8n/JavaScript. El servidor lo lee como `BigDecimal` exacto
        y rechaza (400) más de 2 decimales (p. ej. 28.499999999999996) en lugar de truncar o redondear;

        el tope 90 071 992 547 409.91 = (2^53-1) centavos, el mismo límite seguro que `Money.amount_cents` (está dentro de
        `numeric(18,2)`, que admite hasta 9 999 999 999 999 999.99).

        Moneda siempre explícita (`moneda`); no se mezclan monedas.

        '
    N8nConfianza:
      type: number
      minimum: 0
      maximum: 1
      description: Valor 0..1 que declara el modelo; informativo, no calibrado, no autoriza nada. Se guarda con 3 decimales
        (`numeric(4,3)`, half-even) y el panel lo expone como milésimas.
    N8nInstancia:
      type: string
      minLength: 1
      maxLength: 100
      pattern: ^[A-Za-z0-9._-]+$
      description: Instancia de Evolution (`chat.instancia`), p. ej. `ventas-01`. El servidor verifica que pertenezca a la
        organización de la credencial.
    N8nJid:
      type: string
      minLength: 8
      maxLength: 64
      pattern: ^[0-9]{5,20}(:[0-9]{1,3})?@(s\.whatsapp\.net|lid)$
      description: JID de WhatsApp de un chat individual. Los grupos (`@g.us`) y `status@broadcast` los descarta WF0 antes
        de llamar.
    N8nMensajeProveedorId:
      type: string
      minLength: 4
      maxLength: 128
      pattern: ^[A-Za-z0-9_.-]+$
      description: '`key.id` de Evolution (`mensaje.provider_msg_id`).'
    N8nOrigen:
      type: string
      enum:
      - whatsapp
      - WHATSAPP
      description: WF1 emite `whatsapp` en minúscula; el README de n8n y `orden.origen` usan `WHATSAPP`. Se acepta ambos y
        el servidor guarda `WHATSAPP`.
    N8nClienteTipo:
      type: string
      enum:
      - PERSONA
      - EMPRESA
      description: Subconjunto de `cliente.tipo` que el prompt de WF1 puede emitir (la BD admite además COLEGIO).
    N8nMarca:
      type: string
      enum:
      - CORPOTEX
      - UNICRACK_SPORT
      - UNICRACK_UNIFORMES
      description: 'Marcas del prompt de WF1. `marca.nombre` es texto libre en BD: la correspondencia exacta depende de la
        semilla (pendiente de Andrés).'
    N8nCondicionTipo:
      type: string
      enum:
      - CONTADO
      - CREDITO
      - ANTICIPO
      - NO_DEFINIDA
      description: '`NO_DEFINIDA` no existe en `orden.condicion_pago`: la orden queda en BORRADOR con el campo ausente.'
    N8nTipoVoucher:
      type: string
      enum:
      - YAPE
      - PLIN
      - TRANSFERENCIA
      - DEPOSITO
      - OTRO
      description: Subconjunto de `pago.medio` que emite el prompt de WF2 (la BD admite además EFECTIVO).
    N8nMonedaVoucher:
      type: string
      enum:
      - PEN
      - USD
      description: El prompt de WF2 admite USD; el MVP solo procesa PEN (USD = 422 `CURRENCY_NOT_SUPPORTED`).
    N8nOrdenEstado:
      type: string
      enum:
      - BORRADOR
      - PENDIENTE_APROBACION
      - RETENIDA
      - LIBERADA
      - EN_PRODUCCION
      - DESPACHADA
      - CERRADA
      - CANCELADA
      description: Idéntico a `orden.estado` (V1).
    N8nHojaResumenEstado:
      type: string
      enum:
      - BORRADOR
      - CONFIRMADA
      - DESCARTADA
      description: Idéntico a `hoja_resumen.estado`.
    N8nFasePago:
      type: string
      enum:
      - RECIBIDO
      - VERIFICADO_BANCO
      - APLICADO
      description: Idéntico a `pago.fase`; el voucher de n8n solo produce RECIBIDO.
    N8nEstadoConciliacion:
      type: string
      enum:
      - PENDIENTE
      - APLICADO
      - PARCIAL
      - DUPLICADO
      - SIN_ORDEN
      - NO_CUADRA
      description: Idéntico a `pago.estado_conciliacion`.
    N8nTipoMensajeSaliente:
      type: string
      enum:
      - COBRANZA_PREVENTIVA
      - COBRANZA_VENCIMIENTO
      - MORA_TEMPRANA
      - RECOMPRA
      - ESTADO_CUENTA
      - CONFIRMACION_PAGO
      - RESUMEN_VENDEDOR
      description: Idéntico a `envio_notificacion.tipo`.
    N8nEstadoMensajeSaliente:
      type: string
      enum:
      - PENDIENTE
      - ENVIADO
      - ERROR
      - CANCELADO
      description: Idéntico a `envio_notificacion.estado`.
    N8nEstadoEnvio:
      type: string
      enum:
      - ENVIADO
      - ERROR
      description: Lo que WF3 puede informar.
    N8nExtraccionCliente:
      type: object
      additionalProperties: false
      properties:
        nombre:
          type:
          - string
          - 'null'
          maxLength: 200
        ruc:
          type:
          - string
          - 'null'
          maxLength: 20
          description: Texto leído del chat; el servidor normaliza y valida (`cliente.ruc_dni` es varchar(11)).
        tipo:
          oneOf:
          - $ref: '#/components/schemas/N8nClienteTipo'
          - type: 'null'
    N8nExtraccionItem:
      type: object
      additionalProperties: false
      required:
      - descripcion
      properties:
        descripcion:
          type: string
          minLength: 1
          maxLength: 500
        cantidad:
          type:
          - integer
          - 'null'
          minimum: 1
          maximum: 1000000
          description: Entero > 0 (`orden_item.cantidad`); un decimal o 0 se rechaza con 400.
        unidad:
          type:
          - string
          - 'null'
          maxLength: 50
          description: Sin columna en V1 (se pierde al persistir).
        detalle_tallas:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Va a `orden_item.talla`.
        tela:
          type:
          - string
          - 'null'
          maxLength: 200
        logo_diseno:
          type:
          - string
          - 'null'
          maxLength: 500
          description: Va a `orden_item.logo`.
        precio_unitario:
          oneOf:
          - $ref: '#/components/schemas/N8nSoles'
          - type: 'null'
          description: Va a `orden_item.precio_unit` (numeric(18,2)).
    N8nCondicionPago:
      type: object
      additionalProperties: false
      properties:
        tipo:
          $ref: '#/components/schemas/N8nCondicionTipo'
        plazo_dias:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 365
          description: Plazo propuesto por el chat; la política 15 a 30 días (D-005) la valida Spring y la decisión es del
            vendedor.
        anticipo_monto:
          oneOf:
          - $ref: '#/components/schemas/N8nSoles'
          - type: 'null'
        anticipo_pct:
          type:
          - number
          - 'null'
          minimum: 0
          maximum: 100
    N8nPagoMencionado:
      type: object
      additionalProperties: false
      description: 'Pago MENCIONADO en el chat: una promesa o dato; no es un pago ni reduce deuda.'
      properties:
        monto:
          oneOf:
          - $ref: '#/components/schemas/N8nSoles'
          - type: 'null'
        fecha:
          type:
          - string
          - 'null'
          format: date
        medio:
          type:
          - string
          - 'null'
          maxLength: 50
        nota:
          type:
          - string
          - 'null'
          maxLength: 500
    N8nExtraccionOrden:
      type: object
      additionalProperties: false
      description: 'JSON que el modelo devuelve a WF1 (forma del prompt del nodo `Preparar LLM`). Ante una respuesta no interpretable
        WF1 envía solo `error_parseo`, `crudo`, `faltantes` y `confianza: 0`:

        por eso casi todo es opcional. Campos fuera de esta lista se rechazan (400): un modelo no puede introducir campos
        propios.

        '
      required:
      - faltantes
      - confianza
      properties:
        cliente:
          $ref: '#/components/schemas/N8nExtraccionCliente'
        marca:
          oneOf:
          - $ref: '#/components/schemas/N8nMarca'
          - type: 'null'
        items:
          type: array
          items:
            $ref: '#/components/schemas/N8nExtraccionItem'
          maxItems: 200
        total:
          oneOf:
          - $ref: '#/components/schemas/N8nSoles'
          - type: 'null'
        moneda:
          type: string
          enum:
          - PEN
        condicion_pago:
          $ref: '#/components/schemas/N8nCondicionPago'
        fecha_entrega_solicitada:
          type:
          - string
          - 'null'
          format: date
        pagos_mencionados:
          type: array
          items:
            $ref: '#/components/schemas/N8nPagoMencionado'
          maxItems: 50
        observaciones:
          type: string
          maxLength: 4000
        faltantes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 50
        confianza:
          $ref: '#/components/schemas/N8nConfianza'
        error_parseo:
          type: string
          maxLength: 1000
        crudo:
          type: string
          maxLength: 500
    N8nIngestaOrdenRequest:
      type: object
      additionalProperties: false
      description: 'Cuerpo de `POST /api/v1/ordenes/ingesta`. Sin `organizacion_id`: la organización sale de la credencial
        de servicio.'
      required:
      - origen
      - instancia
      - chatId
      - vendedorJid
      - extraccion
      - hojaResumenMd
      - transcript
      - mensajesProcesados
      - generadoEn
      properties:
        origen:
          $ref: '#/components/schemas/N8nOrigen'
        instancia:
          $ref: '#/components/schemas/N8nInstancia'
        chatId:
          $ref: '#/components/schemas/N8nJid'
        vendedorJid:
          $ref: '#/components/schemas/N8nJid'
        clienteNombreChat:
          type: string
          maxLength: 200
          description: '`pushName` del chat; puede ser cadena vacía.'
        extraccion:
          $ref: '#/components/schemas/N8nExtraccionOrden'
        hojaResumenMd:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown generado por n8n; es dato, nunca instrucción.
        transcript:
          type: string
          maxLength: 60000
          description: 'Compatibilidad WF1: dato transitorio. NUNCA persistir transcript, logs, auditoria, idempotencia ni
            Storage. Solo campos de negocio revisados y vouchers.'
        mensajesProcesados:
          type: integer
          minimum: 0
          maximum: 400
          description: WF1 procesa a lo sumo los últimos 400 mensajes.
        generadoEn:
          type: string
          format: date-time
          description: Instante con desfase (WF1 usa ISO UTC `...Z`).
    N8nAviso:
      type: object
      additionalProperties: false
      required:
      - codigo
      - mensaje
      properties:
        codigo:
          type: string
          pattern: ^[A-Z][A-Z0-9_]*$
          maxLength: 60
        mensaje:
          type: string
          maxLength: 500
    N8nIngestaOrdenResponse:
      type: object
      additionalProperties: false
      description: El README sugería `bloqueos`; se usa `avisos` porque la mora avisa al vendedor y no bloquea (D-005). WF1
        hoy no lee esta respuesta.
      required:
      - ordenId
      - ref
      - estado
      - hojaResumenVersion
      - camposAusentes
      - avisos
      properties:
        ordenId:
          $ref: '#/components/schemas/Uuid'
        ref:
          type: string
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
        estado:
          type: string
          enum:
          - BORRADOR
          description: La ingesta solo crea borradores; `/ok` y la decisión de crédito mueven el estado.
        hojaResumenVersion:
          type: integer
          minimum: 1
        camposAusentes:
          type: array
          items:
            type: string
            maxLength: 200
          maxItems: 50
        avisos:
          type: array
          items:
            $ref: '#/components/schemas/N8nAviso'
          maxItems: 20
    N8nConfirmarOrdenRequest:
      type: object
      additionalProperties: false
      required:
      - ref
      - instancia
      - chatId
      - vendedorJid
      - mensajeId
      properties:
        ref:
          type: string
          pattern: ^[A-Za-z]{1,5}-[0-9]{1,9}$
          description: 'Referencia que el vendedor escribió tras `/ok` (WF0 envía `''''` si falta: 400).'
        instancia:
          $ref: '#/components/schemas/N8nInstancia'
        chatId:
          $ref: '#/components/schemas/N8nJid'
        vendedorJid:
          $ref: '#/components/schemas/N8nJid'
        mensajeId:
          $ref: '#/components/schemas/N8nMensajeProveedorId'
    N8nConfirmarOrdenResponse:
      type: object
      additionalProperties: false
      required:
      - ordenId
      - ref
      - estado
      - hojaResumenEstado
      - confirmadoPorUsuarioId
      - creditoPendiente
      properties:
        ordenId:
          $ref: '#/components/schemas/Uuid'
        ref:
          type: string
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
        estado:
          $ref: '#/components/schemas/N8nOrdenEstado'
        hojaResumenEstado:
          type: string
          enum:
          - CONFIRMADA
        confirmadoPorUsuarioId:
          $ref: '#/components/schemas/Uuid'
        creditoPendiente:
          type: boolean
          description: '`true` si la orden es a crédito y aún no hay decisión del vendedor.'
    N8nVoucherExtraccion:
      type: object
      additionalProperties: false
      description: JSON del modelo de visión (prompt del nodo `Preparar visión`). Ante un parseo fallido WF2 envía `{es_voucher:false,
        confianza:0, error_parseo}`.
      required:
      - es_voucher
      - confianza
      properties:
        es_voucher:
          type: boolean
        tipo:
          oneOf:
          - $ref: '#/components/schemas/N8nTipoVoucher'
          - type: 'null'
        banco:
          type:
          - string
          - 'null'
          maxLength: 100
        monto:
          oneOf:
          - $ref: '#/components/schemas/N8nSoles'
          - type: 'null'
        moneda:
          oneOf:
          - $ref: '#/components/schemas/N8nMonedaVoucher'
          - type: 'null'
        fecha:
          type:
          - string
          - 'null'
          format: date
          description: Fecha de negocio America/Lima.
        hora:
          type:
          - string
          - 'null'
          pattern: ^([01][0-9]|2[0-3]):[0-5][0-9]$
          description: HH:MM local de Lima.
        codigo_operacion:
          type:
          - string
          - 'null'
          maxLength: 64
        remitente:
          type:
          - string
          - 'null'
          maxLength: 200
        destinatario:
          type:
          - string
          - 'null'
          maxLength: 200
        confianza:
          $ref: '#/components/schemas/N8nConfianza'
        error_parseo:
          type: string
          maxLength: 1000
    N8nPagoVoucherRequest:
      type: object
      additionalProperties: false
      required:
      - instancia
      - chatId
      - clienteJid
      - mensajeId
      - recibidoEn
      - extraccion
      properties:
        instancia:
          $ref: '#/components/schemas/N8nInstancia'
        chatId:
          $ref: '#/components/schemas/N8nJid'
        clienteJid:
          $ref: '#/components/schemas/N8nJid'
        mensajeId:
          $ref: '#/components/schemas/N8nMensajeProveedorId'
        pushName:
          type: string
          maxLength: 200
        recibidoEn:
          type: string
          format: date-time
        extraccion:
          $ref: '#/components/schemas/N8nVoucherExtraccion'
        imagen_base64:
          type: string
          pattern: ^[A-Za-z0-9+/]+={0,2}$
          maxLength: 13981016
          description: 'Archivo ORIGINAL del voucher en Base64 PURO (alfabeto estándar, longitud múltiplo de 4, sin saltos de línea
            y SIN prefijo `data:`), dentro del JSON (`application/json`; no multipart). Obligatorio cuando `extraccion.es_voucher`
            es `true` y no hay `error_parseo`; si el voucher es ilegible no hace falta. El servidor decodifica de forma estricta,
            acepta solo JPEG, PNG o PDF completos por su contenido real (no por extensión ni MIME), calcula el SHA-256 de los
            bytes decodificados y sube el archivo al bucket privado con una ruta que él genera. Límite del archivo: 10485760 bytes
            (el del bucket `keptai-vouchers`; configurable `keptai.n8n.voucher.max-file-bytes`); el Base64 de ese archivo ocupa
            13981016 caracteres como máximo. Nunca se persiste ni se registra el Base64.'
    N8nPagoVoucherResponse:
      type: object
      additionalProperties: false
      required:
      - resultado
      - pagoId
      - fase
      - estadoConciliacion
      - duplicadoDePagoId
      - ordenRef
      - alertaId
      - fondosVerificados
      - saldoModificado
      properties:
        resultado:
          type: string
          enum:
          - REGISTRADO
          - IGNORADO_NO_VOUCHER
        pagoId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        fase:
          oneOf:
          - type: string
            enum:
            - RECIBIDO
          - type: 'null'
        estadoConciliacion:
          oneOf:
          - type: string
            enum:
            - PENDIENTE
            - PARCIAL
            - DUPLICADO
            - SIN_ORDEN
            - NO_CUADRA
          - type: 'null'
          description: 'Nunca `APLICADO` aquí: aplicar exige verificación.'
        duplicadoDePagoId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        ordenRef:
          type:
          - string
          - 'null'
          pattern: ^[A-Z]{1,5}-[0-9]{1,9}$
          description: Orden candidata si el motor la encontró.
        alertaId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
          description: '`alerta_cobranza` PAGO_EN_REVISION abierta, si aplica.'
        fondosVerificados:
          type: boolean
          const: false
        saldoModificado:
          type: boolean
          const: false
      allOf:
      - if:
          properties:
            resultado:
              const: REGISTRADO
        then:
          properties:
            pagoId:
              $ref: '#/components/schemas/Uuid'
            fase:
              const: RECIBIDO
            estadoConciliacion:
              type: string
        else:
          properties:
            pagoId:
              type: 'null'
            fase:
              type: 'null'
            estadoConciliacion:
              type: 'null'
            duplicadoDePagoId:
              type: 'null'
            ordenRef:
              type: 'null'
            alertaId:
              type: 'null'
      - if:
          properties:
            estadoConciliacion:
              const: DUPLICADO
        then:
          properties:
            duplicadoDePagoId:
              $ref: '#/components/schemas/Uuid'
        else:
          properties:
            duplicadoDePagoId:
              type: 'null'
    N8nMensajeEstadoRequest:
      type: object
      additionalProperties: false
      description: Cuerpo del nodo `Estado de envío`/`Estado inválido` de WF3 (todas las claves siempre presentes; las ausentes
        van `null`).
      required:
      - mensajeId
      - estado
      - enviadoEn
      properties:
        mensajeId:
          $ref: '#/components/schemas/Uuid'
        ordenId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        tipo:
          oneOf:
          - $ref: '#/components/schemas/N8nTipoMensajeSaliente'
          - type: 'null'
        idempotencyKey:
          type:
          - string
          - 'null'
          maxLength: 128
        estado:
          $ref: '#/components/schemas/N8nEstadoEnvio'
        providerMessageId:
          type:
          - string
          - 'null'
          maxLength: 128
        error:
          type:
          - string
          - 'null'
          maxLength: 400
        enviadoEn:
          type: string
          format: date-time
      allOf:
      - if:
          properties:
            estado:
              const: ERROR
        then:
          properties:
            error:
              type: string
        else:
          properties:
            error:
              type: 'null'
    N8nMensajeEstadoResponse:
      type: object
      additionalProperties: false
      required:
      - mensajeId
      - estado
      - intentos
      properties:
        mensajeId:
          $ref: '#/components/schemas/Uuid'
        estado:
          $ref: '#/components/schemas/N8nEstadoMensajeSaliente'
        intentos:
          type: integer
          minimum: 0
          maximum: 100
    N8nMensajeSalienteWebhook:
      type: object
      additionalProperties: false
      description: Cuerpo que Spring envía al webhook de WF3 (claves que lee el nodo `Normalizar mensaje`, más `clienteId`
        del README, ignorado por WF3 hoy).
      required:
      - mensajeId
      - tipo
      - instance
      - numero
      - texto
      - idempotencyKey
      properties:
        mensajeId:
          $ref: '#/components/schemas/Uuid'
        tipo:
          $ref: '#/components/schemas/N8nTipoMensajeSaliente'
        instance:
          $ref: '#/components/schemas/N8nInstancia'
        numero:
          type: string
          pattern: ^[0-9]{9,15}$
          description: Solo dígitos; un celular peruano de 9 dígitos recibe el prefijo 51 en WF3.
        texto:
          type: string
          minLength: 1
          maxLength: 4000
        delayMs:
          type:
          - integer
          - 'null'
          minimum: 0
          maximum: 60000
        ordenId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        clienteId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
        idempotencyKey:
          type: string
          minLength: 1
          maxLength: 128
    N8nWebhookAccepted:
      type: object
      additionalProperties: false
      required:
      - aceptado
      - mensajeId
      properties:
        aceptado:
          type: boolean
          const: true
        mensajeId:
          oneOf:
          - $ref: '#/components/schemas/Uuid'
          - type: 'null'
    N8nWebhookUnauthorized:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          const: no autorizado
