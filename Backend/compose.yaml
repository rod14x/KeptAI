name: keptai-backend
services:
  backend:
    image: keptai-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BACKEND_HTTP_PORT:-8080}:8080"
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,size=128m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8080"
      VIRTUAL_HOST: keptai.ejesxyz.com
      VIRTUAL_PORT: "8080"
      LETSENCRYPT_HOST: keptai.ejesxyz.com
      LETSENCRYPT_EMAIL: isa.pasco01@gmail.com
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?Configurar JDBC de destino}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME:?Configurar login runtime}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD:?Configurar password runtime}
      KEPTAI_JWT_ISSUER_URI: ${KEPTAI_JWT_ISSUER_URI:?Configurar issuer de Supabase Auth}
      KEPTAI_JWT_JWK_SET_URI: ${KEPTAI_JWT_JWK_SET_URI:?Configurar JWKS de Supabase Auth}
      KEPTAI_JWT_AUDIENCES: ${KEPTAI_JWT_AUDIENCES:-authenticated}
      KEPTAI_CORS_ALLOWED_ORIGINS: ${KEPTAI_CORS_ALLOWED_ORIGINS:-}
      SUPABASE_URL: ${SUPABASE_URL:?Configurar proyecto Supabase}
      SUPABASE_STORAGE_BUCKET: ${SUPABASE_STORAGE_BUCKET:-keptai-vouchers}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:?Configurar clave privada de Storage}
