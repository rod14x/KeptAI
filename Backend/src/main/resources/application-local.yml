# CWD Backend/. .env formato properties, generado por BD/local/db.sh init.
# Perfil independiente de dev: no hereda las exclusiones sin DB de application-dev.yml.
spring:
  config:
    import: "optional:file:${KEPTAI_LOCAL_ENV:../BD/local/.env}[.properties]"
  datasource:
    url: jdbc:postgresql://127.0.0.1:${KEPTAI_DB_PORT:5433}/${KEPTAI_DB_NAME:keptai}?currentSchema=keptai
    username: ${KEPTAI_RUNTIME_USER:keptai_app}
    password: ${KEPTAI_RUNTIME_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: false
keptai:
  security:
    cors:
      # Frontend local de Vite; sobreescribible con KEPTAI_CORS_ALLOWED_ORIGINS.
      allowed-origins: ${KEPTAI_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
