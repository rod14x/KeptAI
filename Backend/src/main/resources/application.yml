spring:
  application:
    name: keptai-backend
  profiles:
    default: dev
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    # Las migraciones (Andrés) se ejecutan como paso de release con rol migrador, no al arrancar la API.
    enabled: false
server:
  port: ${PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true
keptai:
  security:
    # Configuración externa de MIG-03-A. Sin valores = sin configurar; ver Backend/docs/matriz-acceso.md.
    # JWT del panel (Supabase Auth): se configuran los tres juntos (variables de entorno, sin secretos).
    jwt:
      issuer-uri: ${KEPTAI_JWT_ISSUER_URI:}
      jwk-set-uri: ${KEPTAI_JWT_JWK_SET_URI:}
      audiences: ${KEPTAI_JWT_AUDIENCES:}
    # Orígenes exactos del navegador, separados por coma. Vacío = sin CORS.
    cors:
      allowed-origins: ${KEPTAI_CORS_ALLOWED_ORIGINS:}
    # Webhook saliente a WF3 (X-Api-Secret). Url y secreto juntos; el secreto solo por entorno.
    webhook:
      url: ${KEPTAI_N8N_WEBHOOK_URL:}
      secret: ${KEPTAI_N8N_WEBHOOK_SECRET:}
  n8n:
    # Límites en BYTES. El archivo del voucher coincide con el bucket keptai-vouchers (10485760 = 10 MiB); el cuerpo HTTP
    # se deriva (Base64 = 4/3 del archivo + holgura de metadatos). Storage: solo por entorno, sin secretos en Git.
    ingesta:
      max-body-bytes: ${KEPTAI_N8N_INGESTA_MAX_BODY_BYTES:524288}
    voucher:
      max-file-bytes: ${KEPTAI_N8N_VOUCHER_MAX_FILE_BYTES:10485760}
    storage:
      url: ${SUPABASE_URL:}
      bucket: ${SUPABASE_STORAGE_BUCKET:keptai-vouchers}
      secret-key: ${SUPABASE_SECRET_KEY:}
